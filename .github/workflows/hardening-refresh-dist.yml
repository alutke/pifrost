name: Hardening dist refresh (temporary)
on:
  push:
    branches: [hardening-routing-observability-v0.20.0]
permissions:
  contents: write
jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening-routing-observability-v0.20.0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:runtime
      - name: Commit regenerated dist
        run: |
          git add -f dist/
          if git diff --cached --quiet; then
            echo "Already current"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build(hardening): regenerate committed TypeScript dist runtime'
          git push origin HEAD:refs/heads/hardening-routing-observability-v0.20.0
