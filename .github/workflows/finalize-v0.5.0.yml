name: Finalize v0.5.0

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-v0.5.0.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: v0.5.0
      VERSION: 0.5.0
      TARGET: dc3e93f61232f15d13f43b34d3546c6d5fc250b2
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release target
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$TARGET^{commit}"
          package_version="$(git show "$TARGET:package.json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).version))')"
          test "$package_version" = "$VERSION"
          git show "$TARGET:CHANGELOG.md" | grep -q "^## $VERSION "

      - name: Create immutable release tag
        shell: bash
        run: |
          set -euo pipefail
          existing="$(git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $1}')"
          if [ -n "$existing" ]; then
            test "$existing" = "$TARGET" || {
              echo "Tag $TAG already exists at $existing, expected $TARGET" >&2
              exit 1
            }
            echo "$TAG already points to $TARGET"
          else
            git tag "$TAG" "$TARGET"
            git push origin "refs/tags/$TAG"
          fi

      - name: Build release notes from changelog
        shell: bash
        run: |
          set -euo pipefail
          git show "$TARGET:CHANGELOG.md" > /tmp/CHANGELOG.md
          awk -v version="$VERSION" '
            $0 ~ "^## " version " " { capture=1; next }
            capture && /^## / { exit }
            capture { print }
          ' /tmp/CHANGELOG.md > /tmp/release-notes.md
          test -s /tmp/release-notes.md

      - name: Publish GitHub release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG"               --repo "$GITHUB_REPOSITORY"               --verify-tag               --title "Pifrost $VERSION"               --notes-file /tmp/release-notes.md
          fi
          gh release view "$TAG"             --repo "$GITHUB_REPOSITORY"             --json tagName,name,isDraft,isPrerelease,url
