name: Temporary Release 5A lockfile refresh
on:
  push:
    branches: [release-5a-omp-18125-bifrost-232]
permissions:
  contents: write
jobs:
  refresh:
    if: github.repository == 'alutke/pifrost'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Generate npm lockfile from published 18.12.5 packages
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit canonical lockfile to this temporary release branch
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already canonical"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(5A): regenerate canonical npm lockfile for OMP 18.12.5"
          git push origin "HEAD:${GITHUB_REF_NAME}"
