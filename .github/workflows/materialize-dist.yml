name: Materialize dist

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build standalone runtime
        run: node --no-warnings scripts/build-runtime.mjs
      - name: Commit dist
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- dist/)" ]; then
            echo "dist already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/
          git commit -m "build: commit standalone runtime artifacts"
          git push
