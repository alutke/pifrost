name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Validate release package
        run: npm run release:check
      - name: Validate Bifrost public datasheets
        run: node scripts/validate-public-datasheets.mjs
      - name: Validate current OMP route envelopes
        run: npx tsx scripts/validate-current-routing.ts
      - name: Validate pinned Bifrost release contracts
        run: node scripts/validate-bifrost-v2-contract.mjs
      - name: Validate Hound MCP contract
        run: node scripts/validate-hound-contract.mjs
      - name: Validate minimum and current OMP contracts
        run: node scripts/validate-omp-contract.mjs
      - name: Validate with released OMP 18.4.5 CLI/plugin loader
        run: |
          export HOME="$RUNNER_TEMP/omp-home-local"
          mkdir -p "$HOME"
          ./node_modules/.bin/omp --version
          ./node_modules/.bin/omp install . --force
          ./node_modules/.bin/omp plugin list
      - name: Validate with compiled OMP 18.4.8 release binary
        run: |
          OMP_BIN="$RUNNER_TEMP/omp-18.4.8"
          curl --fail --location --silent --show-error \
            "https://github.com/can1357/oh-my-pi/releases/download/v18.4.8/omp-linux-x64" \
            --output "$OMP_BIN"
          chmod +x "$OMP_BIN"
          export HOME="$RUNNER_TEMP/omp-home-compiled"
          mkdir -p "$HOME"
          "$OMP_BIN" --version
          "$OMP_BIN" install . --force
          "$OMP_BIN" plugin list
      - name: Validate with current OMP 18.8.6 release binary
        run: |
          OMP_BIN="$RUNNER_TEMP/omp-18.8.6"
          curl --fail --location --silent --show-error \
            "https://github.com/can1357/oh-my-pi/releases/download/v18.8.6/omp-linux-x64" \
            --output "$OMP_BIN"
          chmod +x "$OMP_BIN"
          export HOME="$RUNNER_TEMP/omp-home-current"
          mkdir -p "$HOME"
          "$OMP_BIN" --version
          "$OMP_BIN" install . --force
          "$OMP_BIN" plugin list
      - name: Validate clean GitHub plugin install
        if: github.event_name == 'push'
        run: |
          export HOME="$RUNNER_TEMP/omp-home-github"
          mkdir -p "$HOME"
          ./node_modules/.bin/omp install "github:${GITHUB_REPOSITORY}#${GITHUB_SHA}" --force
          ./node_modules/.bin/omp plugin list
      - name: Validate clean GitHub plugin install with compiled OMP 18.4.8
        if: github.event_name == 'push'
        run: |
          OMP_BIN="$RUNNER_TEMP/omp-18.4.8"
          export HOME="$RUNNER_TEMP/omp-home-compiled-github"
          mkdir -p "$HOME"
          "$OMP_BIN" install "github:${GITHUB_REPOSITORY}#${GITHUB_SHA}" --force
          "$OMP_BIN" plugin list
