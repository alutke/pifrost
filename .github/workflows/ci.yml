name: CI

permissions:
  contents: write

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: npm install
      - name: Capture dependency lock
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
      - name: Commit dependency lock
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- package-lock.json)" ]; then
            echo "package-lock.json is already committed"
            exit 0
          fi
          git fetch origin "$GITHUB_HEAD_REF"
          git checkout -B "$GITHUB_HEAD_REF" "origin/$GITHUB_HEAD_REF"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: lock npm dependencies"
          git push origin "HEAD:$GITHUB_HEAD_REF"
      - run: npm run check
      - run: npm test
      - name: Validate release package
        run: npm run release:check
      - name: Validate Bifrost public datasheets
        run: node scripts/validate-public-datasheets.mjs
      - name: Validate current OMP route envelopes
        run: npx tsx scripts/validate-current-routing.ts
      - name: Validate Bifrost 2.2.4 and current 2.x contracts
        run: node scripts/validate-bifrost-v2-contract.mjs
      - name: Validate released OMP 18.4.5 contracts
        run: node scripts/validate-omp-contract.mjs
      - name: Validate with released OMP 18.4.5 CLI/plugin loader
        run: |
          export HOME="$RUNNER_TEMP/omp-home-local"
          mkdir -p "$HOME"
          ./node_modules/.bin/omp --version
          ./node_modules/.bin/omp install . --force
          ./node_modules/.bin/omp plugin list
      - name: Validate clean GitHub plugin install
        if: github.event_name == 'push'
        run: |
          export HOME="$RUNNER_TEMP/omp-home-github"
          mkdir -p "$HOME"
          ./node_modules/.bin/omp install "github:${GITHUB_REPOSITORY}#${GITHUB_SHA}" --force
          ./node_modules/.bin/omp plugin list
