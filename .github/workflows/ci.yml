name: CI — Pifrost 0.30

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Enforce CLI-only architecture and current documentation
        run: npm run check
      - name: Test Bifrost management, repo MCP/Skills, model and optional slash UI
        run: npm test
      - name: Verify release candidate pack and dependency closure
        run: npm run release:check
      - name: Verify clean CLI and named OMP profile on Node 22
        run: |
          export PI_CONFIG_DIR="$RUNNER_TEMP/pifrost-omp-root"
          export PIFROST_CONFIG_DIR="$RUNNER_TEMP/pifrost-config"
          export OMP_PROFILE="audit"
          node cli.mjs --version
          node cli.mjs models status
          node cli.mjs omp commands enable --dry-run
          test ! -e "$PI_CONFIG_DIR/profiles/audit/agent/extensions/pifrost-commands.js"
          node cli.mjs omp commands enable
          test -f "$PI_CONFIG_DIR/profiles/audit/agent/extensions/pifrost-commands.js"
          node cli.mjs omp commands disable
          test ! -e "$PI_CONFIG_DIR/profiles/audit/agent/extensions/pifrost-commands.js"
      - name: Verify pinned OMP 18.12.5 native CLI (no inference calls)
        run: |
          OMP_BIN="$RUNNER_TEMP/omp-18.12.5"
          curl --fail --location --silent --show-error \
            "https://github.com/can1357/oh-my-pi/releases/download/v18.12.5/omp-linux-x64" \
            --output "$OMP_BIN"
          echo "fdbc8136084c9a10439569157b2af62312e2b0d801cab54c73e89476da798e7e  $OMP_BIN" | sha256sum -c -
          chmod +x "$OMP_BIN"
          "$OMP_BIN" --version
          "$OMP_BIN" plugin list --json
