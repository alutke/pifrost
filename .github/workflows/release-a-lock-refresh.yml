name: Release A dependency lockfile refresh

on:
  push:
    branches: [feat/release-a-omp-18-12-1]

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.repository == 'alutke/pifrost' && github.ref == 'refs/heads/feat/release-a-omp-18-12-1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Resolve and commit reproducible npm lockfile
        env:
          GITHUB_BRANCH: feat/release-a-omp-18-12-1
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node - <<'NODE'
          const p=require('./package.json'), l=require('./package-lock.json');
          for(const dep of ['@oh-my-pi/pi-ai','@oh-my-pi/pi-catalog','@oh-my-pi/pi-natives','@oh-my-pi/pi-utils','@oh-my-pi/pi-coding-agent']){
            const target=p.dependencies?.[dep]??p.devDependencies?.[dep];
            if(target!=='18.12.1'||l.packages?.['node_modules/'+dep]?.version!==target)throw Error('invalid resolved OMP dependency '+dep);
          }
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build: resolve OMP 18.12.1 dependency lockfile"
            git push origin "HEAD:refs/heads/$GITHUB_BRANCH"
          fi
