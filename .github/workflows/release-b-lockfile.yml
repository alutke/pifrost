name: Release B lockfile refresh (temporary)
on:
  push:
    branches: [release-b-upstream-compat]
permissions:
  contents: write
jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: release-b-upstream-compat
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve full OMP dependency graph
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit canonical package lock
        shell: bash
        run: |
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(release-b): regenerate npm lockfile for OMP 18.10.4'
          git push origin HEAD:refs/heads/release-b-upstream-compat
