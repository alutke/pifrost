name: One-time obsolete branch cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    if: >-
      github.repository == 'alutke/pifrost' &&
      contains(github.event.head_commit.message, '[pifrost-branch-cleanup]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Verify merged PR identity and safely prune
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch='feature/mcp-skill-discovery'
          expected_head='1411b2dc40de19113496d7c43a6674961ea3c199'
          expected_tree='0b4152ba9170df824fa0dfaefea5e0764ca03121'
          pr='39'

          if [[ "$GITHUB_REF" != 'refs/heads/main' || "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "::error::Cleanup must run at the checked-out main commit"
            exit 1
          fi
          if [[ "$(gh api "repos/alutke/pifrost/pulls/$pr" --jq '.merged')" != 'true' ]]; then
            echo "::error::PR not merged; refusing deletion"
            exit 1
          fi
          if [[ "$(gh api "repos/alutke/pifrost/pulls/$pr" --jq '.head.sha')" != "$expected_head" ]]; then
            echo "::error::Reviewed PR head changed; refusing deletion"
            exit 1
          fi
          if [[ "$(gh api 'repos/alutke/pifrost/pulls?state=open&per_page=100' --jq 'length')" != '0' ]]; then
            echo "::error::Open PRs exist; refusing deletion"
            exit 1
          fi
          other_refs="$(git ls-remote --heads origin | awk '$2 != "refs/heads/main" { print $2 "|" $1 }')"
          if [[ -z "$other_refs" ]]; then
            echo 'Only main remains; no deletion required.'
            exit 0
          fi
          if [[ "$other_refs" != "refs/heads/$branch|$expected_head" ]]; then
            echo "::error::Unexpected or moved branch: $other_refs; refusing cleanup"
            exit 1
          fi

          # The merge was squash-based: compare exact tree hashes, not ancestry.
          git fetch --no-tags origin "refs/heads/$branch:refs/remotes/origin/$branch"
          if [[ "$(git show -s --format=%T "$expected_head")" != "$expected_tree" ]]; then
            echo "::error::Reviewed feature tree unexpectedly changed"
            exit 1
          fi
          if [[ "$(git show -s --format=%T "$GITHUB_SHA^")" != "$expected_tree" ]]; then
            echo "::error::Merged main tree differs from reviewed feature tree"
            exit 1
          fi
          git push --force-with-lease="refs/heads/$branch:$expected_head" origin ":refs/heads/$branch"
          if [[ -n "$(git ls-remote --heads origin | awk '$2 != "refs/heads/main" { print $2 }')" ]]; then
            echo "::error::Non-main branches remain after cleanup"
            exit 1
          fi
          echo 'Cleanup confirmed: only main remains; release tags untouched.'
